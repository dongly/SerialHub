# SerialHub 配置文件

# 监听地址
host = "127.0.0.1"

# 日志目录，为空则保存到可执行文件目录下的 logs/
# 日志目录，为空则用平台默认（Linux/macOS: ~/.config/serialhub/logs/，Windows: exe 同目录 logs/）
# logDir = "D:/Logs"

# 调试模式
# debug = false

# 数据内容日志：输出串口/WebSocket 收发数据的内容（500ms 时间窗聚合、单条截断 512 字节）
# 也可用 --log-data 参数或环境变量 SERIALHUB_LOG_DATA=1 开启；
# 优先级为 显式 --log-data > SERIALHUB_LOG_DATA > 本文件，且两者不回写本文件
# logData = false

[serial]
# 串口号，为空时不自动连接（如 COM3、/dev/ttyUSB0）
port = ""
# 启动时自动连接上次使用的端口（默认 true；托盘菜单也可切换）
autoConnect = true
baudRate = 115200
dataBits = 8
# 校验位：none / even / odd
parity = "none"
# 停止位：1 / 1.5 / 2
stopBits = 1

[mcp]
httpPort = 5050

[script]
# MCP serial_script 工具允许的 timeoutMs 范围（毫秒），缺省或非法时回退默认
timeoutMinMs = 100
timeoutMaxMs = 1800000