name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  quality:
    name: Quality gate (vet + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test ./...
        env:
          # 仓库测试断言中文词条；CI runner 无中文 locale 时 i18n 检测为
          # 英文，输出与断言不匹配（i18n 语言在包 init 时求值，无法在
          # 测试内覆盖，故在此固定语境）。
          SERIALHUB_LANG: zh

  build:
    name: Build ${{ matrix.os }}/${{ matrix.arch }}
    needs: quality
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: linux,   arch: amd64 }
          - { os: windows, arch: amd64 }
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build binary
        env:
          CGO_ENABLED: 0
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          [ "$VERSION" = "${GITHUB_REF_NAME}" ] && VERSION="$(awk -F'"' '/Version =/{print $2}' pkg/version/version.go)"
          EXT=""; [ "${{ matrix.os }}" = "windows" ] && EXT=".exe"
          go build -trimpath -ldflags "-s -w -X github.com/dongly/serialhub/pkg/version.Version=${VERSION}" \
            -o "build/serialhub${EXT}" ./cmd/serialhub
          echo "EXT=${EXT}" >> "$GITHUB_ENV"
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"

      - name: Package
        run: |
          VERSION="${{ env.VERSION }}"
          EXT="${{ env.EXT }}"
          STAGE="serialhub-${VERSION}-${{ matrix.os }}-${{ matrix.arch }}"
          mkdir "${STAGE}"
          mv "build/serialhub${EXT}" "${STAGE}/"
          cp config.example.toml "${STAGE}/config.toml"
          cp README.md README.en.md MCP.md QUICKSTART.md LICENSE "${STAGE}/"
          echo "${VERSION}" > "${STAGE}/VERSION"
          if [ "${{ matrix.os }}" = "windows" ]; then
            cp sr.ps1 sr.bat "${STAGE}/"
            7z a "${STAGE}.zip" "${STAGE}"
            sha256sum "${STAGE}.zip" > "${STAGE}.zip.sha256"
          else
            tar -czf "${STAGE}.tar.gz" "${STAGE}"
            sha256sum "${STAGE}.tar.gz" > "${STAGE}.tar.gz.sha256"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: serialhub-${{ matrix.os }}-${{ matrix.arch }}
          path: |
            serialhub-*.zip
            serialhub-*.tar.gz
            serialhub-*.sha256

  release:
    name: Create release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate release notes (git-cliff)
        uses: orhun/git-cliff-action@v4
        id: cliff
        with:
          config: cliff.toml
          args: --latest --strip header
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          body: ${{ steps.cliff.outputs.content }}
          files: |
            dist/serialhub-*.zip
            dist/serialhub-*.tar.gz
            dist/serialhub-*.sha256
