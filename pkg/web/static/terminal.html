<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SerialHub Terminal</title>
    <link rel="stylesheet" href="/static/xterm.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html, body {
            width: 100%;
            height: 100%;
            background-color: #1e1e1e;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }
        #control-panel {
            background-color: #2d2d2d;
            padding: 8px 12px;
            display: flex;
            align-items: center;
            gap: 12px;
            border-bottom: 1px solid #3d3d3d;
            flex-wrap: wrap;
            justify-content: flex-start;
        }
        #control-panel label {
            color: #d4d4d4;
            font-size: 12px;
            font-family: Consolas, "Courier New", monospace;
        }
        #control-panel select, #control-panel input {
            background-color: #3d3d3d;
            color: #d4d4d4;
            border: 1px solid #4d4d4d;
            padding: 4px 8px;
            font-size: 12px;
            font-family: Consolas, "Courier New", monospace;
            border-radius: 3px;
        }
        #control-panel select option {
            background-color: #3d3d3d;
            color: #d4d4d4;
            font-size: 12px;
            font-family: Consolas, "Courier New", monospace;
        }
        #control-panel select:focus, #control-panel input:focus {
            outline: none;
            border-color: #0078d4;
        }
        #control-panel button {
            color: #ffffff;
            border: none;
            padding: 6px 12px;
            font-size: 12px;
            font-family: Consolas, "Courier New", monospace;
            border-radius: 3px;
            cursor: pointer;
        }
        #control-panel button.connect {
            background-color: #4caf50;
        }
        #control-panel button.connect:hover {
            background-color: #45a049;
        }
        #control-panel button.disconnect {
            background-color: #f44336;
        }
        #control-panel button.disconnect:hover {
            background-color: #da190b;
        }
        #control-panel button.refresh {
            background-color: #2196f3;
        }
        #control-panel button.refresh:hover {
            background-color: #1976d2;
        }
        #control-panel button.exit {
            background-color: #ff9800;
        }
        #control-panel button.exit:hover {
            background-color: #f57c00;
        }
        #control-panel button:disabled {
            background-color: #555;
            cursor: not-allowed;
        }
        #language-btn { background-color: #555; }
        #language-btn:hover { background-color: #666; }
        #status-indicator {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background-color: #888;
        }
        #status-indicator.connected {
            background-color: #4caf50;
        }
        #status-indicator.disconnected {
            background-color: #888;
        }
        #status-indicator.error {
            background-color: #f44336;
        }
        #terminal-container {
            width: 100%;
            height: calc(100vh - 42px);
            position: relative;
            overflow: hidden;
            padding: 8px 8px 0 8px;
            box-sizing: border-box;
        }
        .xterm {
            width: 100%;
            height: 100%;
        }
        .xterm-viewport {
            width: 100% !important;
            height: 100% !important;
            overflow-y: auto !important;
            overflow-x: hidden !important;
        }
        .xterm {
            width: 100%;
            height: 100%;
        }
        .xterm-viewport {
            width: 100% !important;
            height: 100% !important;
            overflow-y: auto !important;
            overflow-x: hidden !important;
        }
        #version-info {
            margin-left: auto;
            color: #6e6e6e;
            font-size: 11px;
            font-family: Consolas, "Courier New", monospace;
            pointer-events: none;
            user-select: none;
            padding-right: 8px;
        }
        #version-info .app-name {
            color: #4caf50;
            font-weight: bold;
        }
        #version-info .version {
            color: #888;
        }
        #version-info .side-badge {
            display: inline-block;
            margin-right: 6px;
            padding: 1px 6px;
            border: 1px solid #4a9eff;
            border-radius: 3px;
            color: #4a9eff;
            font-size: 10px;
            line-height: 14px;
        }
        #version-info .side-badge.unknown {
            border-color: #666;
            color: #888;
        }
    </style>
</head>
<body>
    <div id="control-panel">
        <span id="status-indicator" class="disconnected"></span>
        <label data-i18n="portLabel">Port:</label>
        <select id="port-select">
            <option value="" data-i18n="refreshPlaceholder">-- Refresh list --</option>
        </select>
        <label data-i18n="baudLabel">Baud rate:</label>
        <select id="baud-rate">
            <option value="9600">9600</option>
            <option value="19200">19200</option>
            <option value="38400">38400</option>
            <option value="57600">57600</option>
            <option value="115200" selected>115200</option>
            <option value="230400">230400</option>
            <option value="460800">460800</option>
            <option value="921600">921600</option>
        </select>
        <label data-i18n="dataBitsLabel">Data bits:</label>
        <select id="data-bits">
            <option value="5">5</option>
            <option value="6">6</option>
            <option value="7">7</option>
            <option value="8" selected>8</option>
        </select>
        <label data-i18n="parityLabel">Parity:</label>
        <select id="parity">
            <option value="none" selected>none</option>
            <option value="even">even</option>
            <option value="odd">odd</option>
        </select>
        <label data-i18n="stopBitsLabel">Stop bits:</label>
        <select id="stop-bits">
            <option value="1" selected>1</option>
            <option value="2">2</option>
        </select>
        <button id="connect-btn" class="connect" data-i18n="connect">Connect</button>
        <button id="disconnect-btn" class="disconnect" data-i18n="disconnect" disabled>Disconnect</button>
        <button id="refresh-btn" class="refresh" data-i18n="refresh">Refresh</button>
        <button id="exit-btn" class="exit" data-i18n="exit">Exit</button>
        <button id="language-btn" type="button" aria-label="Switch language">中文</button>
        <div id="version-info"><span class="side-badge" id="side-badge"></span><span class="app-name">SerialHub</span> <span class="version" id="app-version"></span></div>
    </div>
    <div id="terminal-container"></div>
    <script src="/static/xterm.min.js"></script>
    <script src="/static/xterm-addon-fit.min.js"></script>
    <script src="/static/i18n.js"></script>
    <script>
        (function() {
            const translations = window.serialHubTranslations;
            let language;
            try { language = localStorage.getItem('serialhub-language'); } catch (_) { /* private browsing */ }
            if (language !== 'zh' && language !== 'en') {
                language = /^zh\b/i.test(navigator.language || '') ? 'zh' : 'en';
            }
            const t = key => translations[language][key];
            let sideLabel = '';
            function applyLanguage() {
                document.documentElement.lang = language === 'zh' ? 'zh-CN' : 'en';
                document.querySelectorAll('[data-i18n]').forEach(el => { el.textContent = t(el.dataset.i18n); });
                document.getElementById('language-btn').textContent = language === 'zh' ? 'English' : '中文';
                document.getElementById('language-btn').setAttribute('aria-label', t('switchLanguage'));
                document.getElementById('port-select').options[0].textContent = t('selectPlaceholder');
                document.title = t('terminalTitle') + (sideLabel ? ' — ' + sideLabel : '');
            }
            document.getElementById('language-btn').onclick = function() {
                language = language === 'zh' ? 'en' : 'zh';
                try { localStorage.setItem('serialhub-language', language); } catch (_) { /* private browsing */ }
                applyLanguage();
            };
            applyLanguage();
            const terminalContainer = document.getElementById('terminal-container');
            const terminal = new Terminal({
                cursorBlink: true,
                fontSize: 14,
                fontFamily: 'Consolas, "Courier New", monospace',
                theme: {
                    background: '#1e1e1e',
                    foreground: '#d4d4d4',
                    cursor: '#ffffff',
                    selection: 'rgba(255, 255, 255, 0.3)'
                },
                wordWrap: false,
                convertEol: true,
                scrollback: 10000
            });

            const fitAddon = new FitAddon.FitAddon();
            terminal.loadAddon(fitAddon);
            terminal.open(terminalContainer);
            
            // 自定义 fit 方法，预留底部一行空间
            function fitWithReserve() {
                var dims = fitAddon.proposeDimensions();
                if (dims && dims.rows > 1) {
                    // 预留一行空间
                    terminal.resize(dims.cols, dims.rows - 1);
                } else if (dims) {
                    terminal.resize(dims.cols, dims.rows);
                }
            }
            
            fitWithReserve();
            terminal.scrollToBottom();

            // 在数据写入前记录滚动条是否在底部，写入后按此决定是否跟随
            var wasAtBottom = true;

            function checkAtBottom() {
                var viewport = document.querySelector('.xterm-viewport');
                if (!viewport) return true;
                return viewport.scrollHeight - viewport.scrollTop - viewport.clientHeight < 2;
            }

            // 用户手动滚动时更新状态
            var xtermViewport = document.querySelector('.xterm-viewport');
            if (xtermViewport) {
                xtermViewport.addEventListener('scroll', function() {
                    wasAtBottom = checkAtBottom();
                });
            }
            // 延迟绑定，确保 xterm-viewport 已渲染
            setTimeout(function() {
                var vp = document.querySelector('.xterm-viewport');
                if (vp) {
                    vp.addEventListener('scroll', function() {
                        wasAtBottom = checkAtBottom();
                    });
                }
            }, 500);

            const statusIndicator = document.getElementById('status-indicator');
            const portSelect = document.getElementById('port-select');
            const baudRateSelect = document.getElementById('baud-rate');
            const dataBitsSelect = document.getElementById('data-bits');
            const paritySelect = document.getElementById('parity');
            const stopBitsSelect = document.getElementById('stop-bits');
            const connectBtn = document.getElementById('connect-btn');
            const disconnectBtn = document.getElementById('disconnect-btn');
            const refreshBtn = document.getElementById('refresh-btn');
            const exitBtn = document.getElementById('exit-btn');

            const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            const wsUrl = protocol + '//' + window.location.host + '/ws';
            let ws;
            let reconnectDelay = 1000;
            let reconnectTimer = null;
            // 断线一律有限重连：给前台代理接管留窗口；超时无实例
            // 监听则停止并提示，任何场景都不无限刷屏。
            let reconnectRetries = 0;

            let isConnected = false;
            let lastStatusPort = null; // status 公告去重：同端口不重复打印「已连接」
            fetch('/version')
                .then(function(response) { return response.json(); })
                .then(function(data) {
                    if (data.version) {
                        document.getElementById('app-version').textContent = 'v' + data.version;
                    }
                });
            // 实例所在系统徽标：Windows/WSL 双实例并存时区分数据来源；
            // sideDetail 为更具体来源（WSL 发行版名 / 主机名，如 Ubuntu、DONG21）
            fetch('/health')
                .then(function(response) { return response.json(); })
                .then(function(data) {
                    var side = (data.side || '').toUpperCase();
                    var detail = data.sideDetail || '';
                    var badge = document.getElementById('side-badge');
                    if (side) {
                        sideLabel = detail ? side + '·' + detail : side;
                        badge.textContent = sideLabel;
                        applyLanguage();
                    } else {
                        badge.textContent = '?';
                        badge.className = 'side-badge unknown';
                    }
                });

            function updateConnectionStatus(connected) {
                isConnected = connected;
                if (connected) {
                    statusIndicator.className = 'connected';
                    connectBtn.disabled = true;
                    disconnectBtn.disabled = false;
                    portSelect.disabled = true;
                    baudRateSelect.disabled = true;
                    dataBitsSelect.disabled = true;
                    paritySelect.disabled = true;
                    stopBitsSelect.disabled = true;
                } else {
                    statusIndicator.className = 'disconnected';
                    connectBtn.disabled = false;
                    disconnectBtn.disabled = true;
                    portSelect.disabled = false;
                    baudRateSelect.disabled = false;
                    dataBitsSelect.disabled = false;
                    paritySelect.disabled = false;
                    stopBitsSelect.disabled = false;
                }
            }

            function sendCommand(type, data) {
                if (ws && ws.readyState === WebSocket.OPEN) {
                    ws.send(JSON.stringify({ type: type, data: data }));
                    return true;
                }
                return false;
            }

            function handleWSOpen() {
                reconnectDelay = 1000;
                reconnectRetries = 0;
                exitBtn.disabled = false; // 退出按钮在关闭/接管流程中被禁用，重连成功后恢复
                terminal.writeln('\x1b[32m[SerialHub] ' + t('terminalConnected') + '\x1b[0m');
                sendCommand('get_ports');
                sendCommand('get_status');
            }

            function shouldAutoScroll() {
                return checkAtBottom() && !terminal.hasSelection();
            }

            function writeAndScroll(data) {
                var scroll = shouldAutoScroll();
                terminal.write(data);
                if (scroll) {
                    setTimeout(function() {
                        terminal.scrollToBottom();
                    }, 10);
                }
            }

            function handleWSMessage(event) {
                if (event.data instanceof ArrayBuffer) {
                    writeAndScroll(new Uint8Array(event.data));
                } else {
                    try {
                        const msg = JSON.parse(event.data);
                        handleMessage(msg);
                    } catch (e) {
                        writeAndScroll(event.data);
                    }
                }
            }

            function handleMessage(msg) {
                switch (msg.type) {
                    case 'ports':
                        updatePortList(msg.data);
                        announcePorts(msg.data);
                        break;
                    case 'status':
                        updateConnectionStatus(msg.data.connected);
                        if (msg.data.connected && msg.data.port) {
                            // 重连/接管时 onopen 与 masterTakeover 各查一次 status，
                            // 同端口的重复公告去重（下拉框选择仍每次同步）。
                            if (msg.data.port !== lastStatusPort) {
                                terminal.writeln('\x1b[32m[SerialHub] ' + t('connectedPort') + msg.data.port + '\x1b[0m');
                                lastStatusPort = msg.data.port;
                            }
                            // 自动选择已连接的串口
                            selectPortFromStatus(msg.data.port);
                        } else if (!msg.data.connected) {
                            lastStatusPort = null;
                        }
                        break;
                    case 'connected':
                        // 终端提示统一由 serial_event 广播渲染（所有客户端一份），
                        // 这里只更新界面状态，避免发起命令的客户端出现双行。
                        updateConnectionStatus(true);
                        break;
                    case 'disconnected':
                        updateConnectionStatus(false);
                        break;
                    case 'shutting_down':
                        terminal.writeln('\x1b[33m[SerialHub] ' + t('shuttingDown') + '\x1b[0m');
                        exitBtn.disabled = true;
                        break;
                    case 'error':
                        terminal.writeln('\x1b[31m[SerialHub] ' + t('error') +
                            (msg.data && typeof msg.data === 'object' && msg.data.code ?
                                (t(msg.data.code) || t('serialError')) : msg.data) + '\x1b[0m');
                        statusIndicator.className = 'error';
                        break;
                    case 'serial_event':
                        // 服务端只发语言无关的事件码，未知码按通用串口错误处理。
                        if (msg.data && msg.data.code === 'serialConnected') {
                            terminal.writeln('\x1b[32m[SerialHub] ' + t('connectedPort') + msg.data.port + '\x1b[0m');
                        } else if (msg.data && msg.data.code === 'serialDisconnected') {
                            terminal.writeln('\x1b[33m[SerialHub] ' + t('disconnectedPort') + '\x1b[0m');
                        } else {
                            terminal.writeln('\x1b[31m[SerialHub] ' + t('serialError') + '\x1b[0m');
                        }
                        break;
                    case 'system_event':
                        if (msg.data && msg.data.code === 'masterTakeover') {
                            terminal.writeln('\x1b[33m[SerialHub] ' + t('masterTakeover') + '\x1b[0m');
                            // 同步刷新按键与状态灯到新主实际串口状态
                            //（响应经 'status' 分支驱动 updateConnectionStatus）
                            sendCommand('get_status');
                        }
                        break;
                    case 'serial_message':
                        terminal.write(msg.data);
                        break;
                }
            }

            function updatePortList(ports) {
                portSelect.replaceChildren(new Option(t('selectPlaceholder'), ''));
                ports.forEach(function(port) {
                    const option = document.createElement('option');
                    option.value = port;
                    option.textContent = port;
                    portSelect.appendChild(option);
                });
            }

            // 在终端写一行串口列表提示（刷新与页面加载时都会触发）
            function announcePorts(ports) {
                if (ports.length > 0) {
                    terminal.writeln('\x1b[36m[SerialHub] ' + t('portsFound')(ports.length) + ports.join(', ') + '\x1b[0m');
                } else {
                    terminal.writeln('\x1b[33m[SerialHub] ' + t('noPorts') + '\x1b[0m');
                }
            }

            function selectPortFromStatus(portInfo) {
                // 从端口信息字符串中提取端口号 (如 "COM7@115200 8N1" -> "COM7")
                const portMatch = portInfo.match(/^(COM\d+|\/dev\/tty\w+)/);
                if (portMatch) {
                    const portName = portMatch[1];
                    // 在下拉框中选择该端口
                    for (let i = 0; i < portSelect.options.length; i++) {
                        if (portSelect.options[i].value === portName) {
                            portSelect.selectedIndex = i;
                            break;
                        }
                    }
                }
            }

            function handleWSError() {
                terminal.writeln('\x1b[31m[SerialHub] ' + t('wsError') + '\x1b[0m');
                statusIndicator.className = 'error';
            }

            function handleWSClose(event) {
                if (event.target !== ws) return;
                terminal.writeln('\x1b[31m[SerialHub] ' + t('connectionClosed') + '\x1b[0m');
                updateConnectionStatus(false);
                // 断线重连：主实例退出后前台代理会原地接管（同端口），
                // 浏览器自动接回并收到「新实例已接管」提示。
                if (reconnectTimer === null) {
                    reconnectRetries++;
                    // 退避 1,2,4,5,5 共 5 次，间隔总和约 17s（不含握手
                    // 耗时），覆盖前台代理接管流程（实测约 4-6s）；
                    // 超时无实例监听则停止，不无限刷屏。
                    if (reconnectRetries > 5) {
                        terminal.writeln('\x1b[31m[SerialHub] ' + t('serviceExited') + '\x1b[0m');
                        return;
                    }
                    terminal.writeln('\x1b[33m[SerialHub] ' + t('reconnecting') + '\x1b[0m');
                    reconnectTimer = setTimeout(function() {
                        reconnectTimer = null;
                        connectWS();
                    }, reconnectDelay);
                    reconnectDelay = Math.min(reconnectDelay * 2, 5000);
                }
            }

            function connectWS() {
                ws = new WebSocket(wsUrl);
                ws.binaryType = 'arraybuffer';
                ws.onopen = handleWSOpen;
                ws.onmessage = handleWSMessage;
                ws.onerror = handleWSError;
                ws.onclose = handleWSClose;
            }
            connectWS();

            terminal.onData(function(data) {
                if (ws && ws.readyState === WebSocket.OPEN) {
                    const encoder = new TextEncoder();
                    const uint8Array = encoder.encode(data);
                    ws.send(uint8Array);
                }
            });

            connectBtn.onclick = function() {
                const port = portSelect.value;
                if (!port) {
                    terminal.writeln('\x1b[31m[SerialHub] ' + t('choosePort') + '\x1b[0m');
                    return;
                }
                const baudRate = parseInt(baudRateSelect.value);
                const dataBits = parseInt(dataBitsSelect.value);
                const parity = paritySelect.value;
                const stopBits = parseInt(stopBitsSelect.value);
                terminal.writeln('\x1b[36m[SerialHub] ' + t('connecting') + port + '@' + baudRate + '...\x1b[0m');
                sendCommand('connect', { port: port, baudRate: baudRate, dataBits: dataBits, parity: parity, stopBits: stopBits });
            };

            disconnectBtn.onclick = function() {
                terminal.writeln('\x1b[36m[SerialHub] ' + t('disconnecting') + '\x1b[0m');
                sendCommand('disconnect');
            };

            refreshBtn.onclick = function() {
                terminal.writeln('\x1b[36m[SerialHub] ' + t('refreshing') + '\x1b[0m');
                sendCommand('get_ports');
            };

            exitBtn.onclick = function() {
                if (confirm(t('confirmExit'))) {
                    if (sendCommand('shutdown')) {
                        // 发送成功才禁用并提示；shutting_down 响应属尽力送达
                        // （广播仅入队，进程退出时可能丢失），故不依赖响应
                        exitBtn.disabled = true;
                        terminal.writeln('\x1b[33m[SerialHub] ' + t('requestedExit') + '\x1b[0m');
                    } else {
                        terminal.writeln('\x1b[31m[SerialHub] ' + t('notSent') + '\x1b[0m');
                    }
                }
            };

            window.addEventListener('resize', function() {
                setTimeout(function() {
                    fitWithReserve();
                    terminal.scrollToBottom();
                    if (ws.readyState === WebSocket.OPEN) {
                        ws.send(JSON.stringify({ type: 'resize', cols: terminal.cols, rows: terminal.rows }));
                    }
                }, 100);
            });

            // 监听用户输入，如果当前在底部且无选中则跟随
            terminal.onData(function() {
                if (shouldAutoScroll()) {
                    setTimeout(function() {
                        terminal.scrollToBottom();
                    }, 10);
                }
            });
        })();
    </script>
</body>
</html>
