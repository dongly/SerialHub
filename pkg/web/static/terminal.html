<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SerialHub Terminal</title>
    <link rel="stylesheet" href="/static/xterm.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html, body {
            width: 100%;
            height: 100%;
            background-color: #1e1e1e;
            overflow: hidden;
        }
        #terminal-container {
            width: 100%;
            height: 100%;
            padding: 8px;
        }
    </style>
</head>
<body>
    <div id="terminal-container"></div>
    <script src="/static/xterm.min.js"></script>
    <script src="/static/xterm-addon-fit.min.js"></script>
    <script>
        (function() {
            const terminalContainer = document.getElementById('terminal-container');
            const terminal = new Terminal({
                cursorBlink: true,
                fontSize: 14,
                fontFamily: 'Consolas, "Courier New", monospace',
                theme: {
                    background: '#1e1e1e',
                    foreground: '#d4d4d4',
                    cursor: '#ffffff',
                    selection: 'rgba(255, 255, 255, 0.3)'
                },
                // 禁用自动换行，让终端自己处理
                wordWrap: false,
                // 启用回车换行转换
                convertEol: true,
                // 设置合适的滚动缓冲区
                scrollback: 10000
            });

            const fitAddon = new FitAddon.FitAddon();
            terminal.loadAddon(fitAddon);
            terminal.open(terminalContainer);
            fitAddon.fit();

            const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            const wsUrl = protocol + '//' + window.location.host + '/ws';
            const ws = new WebSocket(wsUrl);

            ws.onopen = function() {
                terminal.writeln('SerialHub Terminal Connected');
            };

            ws.onmessage = function(event) {
                // 处理换行符，确保正确显示
                let data = event.data;
                // 将 \r\n 转换为 \r\n，\n 转换为 \r\n（xterm.js 需要 \r\n 来正确换行）
                data = data.replace(/\r?\n/g, '\r\n');
                // 处理 \r 单独出现的情况
                data = data.replace(/\r([^\n])/g, '\r\n$1');
                terminal.write(data);
            };

            ws.onerror = function(error) {
                terminal.writeln('\r\n\x1b[31mWebSocket Error\x1b[0m');
            };

            ws.onclose = function() {
                terminal.writeln('\r\n\x1b[31mConnection Closed\x1b[0m');
            };

            terminal.onData(function(data) {
                if (ws.readyState === WebSocket.OPEN) {
                    ws.send(data);
                }
            });

            window.addEventListener('resize', function() {
                fitAddon.fit();
                // 延迟发送 resize 消息，确保终端已调整大小
                setTimeout(function() {
                    if (ws.readyState === WebSocket.OPEN) {
                        ws.send(JSON.stringify({ type: 'resize', cols: terminal.cols, rows: terminal.rows }));
                    }
                }, 100);
            });
        })();
    </script>
</body>
</html>
